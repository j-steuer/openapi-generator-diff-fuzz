[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telephuzz"
version = "0.1.0"
description = "A project for differential fuzzing of OpenAPI-based client libraries."
authors = [
    { name="Justin Steuer", email="s8jnsteu@stud.uni-saarland.de" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "docker==7.1.0",
    "mitmproxy==12.2.1"
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "black==26.3.1",
    "flake8==7.3.0",
    "mypy==1.20.0",
    "pre-commit==4.5.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
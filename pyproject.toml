[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telephuzz"
version = "0.1.0"
description = "A project for differential fuzzing of OpenAPI-based client libraries."
authors = [
    { name="Justin Steuer", email="s8jnsteu@stud.uni-saarland.de" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
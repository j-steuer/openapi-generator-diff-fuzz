api:
  compose-path: "/compose/docker-compose.yaml"
  database-type: "H2"
  api-port-name: "HOST_PORT"
  port-names: ["HOST_PORT", "DB_PORT"]
  non-deterministic-fields:
    POST-test/example: ["date", "token"]
    GET-test/random: ["random"]

targets: ["openapi-generator:python", "swagger-codegen:python"]

fuzzing:
  log-path: "/logs/telephuzz"
  timeout: 3600
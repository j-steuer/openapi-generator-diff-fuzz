api:
  compose-path: "/compose/docker-compose.yaml"
  database-type: "H2"
  api-port-name: "HOST_PORT"
  port-names: ["HOST_PORT", "DB_PORT"]
  non-deterministic-fields:
    POST-test/example: ["date", "token"]
    GET-test/random: ["random"]

targets:
  - id: openapi-generator:python
    lib_name: openapi-gen-python-client

  - id: swagger-codegen:python
    lib_name: swagger-codegen-python-client

fuzzing:
  log-path: "/tmp/logs/telephuzz"
  timeout: 3600
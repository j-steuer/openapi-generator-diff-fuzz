api-port-name: HOST_PORT
compose-path: wfd/dockerfiles/swagger-petstore.yaml
spec-path: wfd/openapi-swagger/swagger-petstore.json
container-name: mitmproxy
port-names:
- HOST_PORT
- AUTH_PORT
- JACOCO_PORT
nondeterministic_components:
- regex_component: 'ID: [a-f0-9]+'
- json_component: shipDate
- path: /user/login
  regex_component: 'Logged in user session: [0-9]+'
jacoco-port: 6300
jacoco-report: ./reports/coverage/api_petshop_config

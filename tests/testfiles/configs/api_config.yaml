container-name: "api"
compose-path: "/compose/docker-compose.yaml"
spec-path: tests/testfiles/openapi_test_fuzzing.json
database-type: "H2"
api-port-name: "HOST_PORT"
port-names: ["HOST_PORT", "DB_PORT"]
nondeterministic-fields:
  POST:
    /test/example:
      - timestamp
      - token
  GET:
    /test/random:
      - random
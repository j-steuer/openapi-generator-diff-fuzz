container-name: api
compose-path: /compose/docker-compose.yaml
spec-path: tests/testfiles/openapi_test_fuzzing.json
database-type: H2
api-port-name: HOST_PORT
port-names:
- HOST_PORT
- DB_PORT
nondeterministic_components:
- method: POST
  path: /test/example
  json_component: timestamp
- method: GET
  path: /test/random
  json_component: random
jacoco-port: 6300
jacoco-report: ./reports/coverage/api_config
